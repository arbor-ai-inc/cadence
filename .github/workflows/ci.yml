name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The leak gate runs first and alone. Everything else in this repo is
      # only publishable if this passes, so a failure here should be the whole
      # signal rather than one red line among many.
      - name: no leaks from the private source tree
        run: python3 tests/check_no_leaks.py

      - name: config loader
        run: python3 tools/cadence_config.py --selftest

  suites:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Every suite is listed explicitly and unconditionally. A step that
      # skips when a file is absent makes an unrun suite and a passing suite
      # look identical, which is the trap in examples/case-studies.md C-10.

      - name: config loader
        run: python3 tools/cadence_config.py --selftest

      - name: hash contract
        run: python3 tools/spec_hash.py --selftest

      - name: ask transport
        run: python3 tools/ask.py --selftest

      - name: review-state reader
        run: python3 tools/review_state.py

      - name: fan-out engine
        run: python3 tests/check_fanout.py

      - name: adapters stay thin and links resolve
        run: python3 tests/check_agent_skills.py

      - name: generated codex adapters are fresh
        run: python3 scripts/gen_adapters.py --check

  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: manifests parse
        run: |
          python3 -c "import json; json.load(open('.claude-plugin/plugin.json'))"
          python3 -c "import json; json.load(open('.claude-plugin/marketplace.json'))"
