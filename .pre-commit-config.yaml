# Cadence's own hooks. Adopters do not need these -- they configure their lint
# command in cadence.toml instead. These guard this repository's release.
repos:
  - repo: local
    hooks:
      - id: no-leaks
        name: no-leaks
        description: >
          Fail if anything from the private source tree survives into a
          publishable file. Runs on every commit because the cost of noticing
          late is a public git history that cannot be un-published.
        entry: python3 tests/check_no_leaks.py
        language: system
        pass_filenames: false
        always_run: true

      - id: cadence-config
        name: cadence-config
        description: The config loader and the must-stop matcher are load-bearing for every workflow.
        entry: python3 tools/cadence_config.py --selftest
        language: system
        pass_filenames: false
        files: ^(tools/cadence_config\.py|templates/cadence\.toml)$

      - id: spec-hash
        name: spec-hash
        description: The normalization contract decides whether a frozen gate detects an edit.
        entry: python3 tools/spec_hash.py --selftest
        language: system
        pass_filenames: false
        files: ^tools/spec_hash\.py$

      - id: ask-transport
        name: ask-transport
        description: The four exit codes are a contract every workflow branches on.
        entry: python3 tools/ask.py --selftest
        language: system
        pass_filenames: false
        files: ^tools/ask\.py$

      - id: review-state
        name: review-state
        description: >
          Four signals render a passing state for a review that never ran. This
          reader is the one place that reasoning lives, so it is self-tested.
        entry: python3 tools/review_state.py
        language: system
        pass_filenames: false
        files: ^tools/review_state\.py$

      - id: fanout
        name: fanout
        description: >
          69 tests over real git worktrees. Slow (~30s) but this is the only gate
          on an engine that creates and deletes branches.
        entry: python3 tests/check_fanout.py
        language: system
        pass_filenames: false
        files: ^(tools/(fanout|cadence_config)\.py|tests/check_fanout\.py)$

      - id: gen-adapters
        name: gen-adapters
        description: >
          The Codex adapters are derived from the Claude ones. Two authored sets
          is two places to correct when a workflow changes.
        entry: python3 scripts/gen_adapters.py --check
        language: system
        pass_filenames: false
        files: ^(skills/.*|adapters/.*|scripts/gen_adapters\.py)$

      - id: agent-skills
        name: agent-skills
        description: Adapters stay thin, frontmatter is valid, and reference/ links resolve.
        entry: python3 tests/check_agent_skills.py
        language: system
        pass_filenames: false
        files: ^(reference/.*|skills/.*|agents/.*|adapters/.*|templates/.*|tests/check_agent_skills\.py)$

      - id: plugin-manifest
        name: plugin-manifest
        description: >
          plugin.json's agents key is an array of file paths, so adding an agent
          without touching the manifest ships one the plugin never registers.
        entry: python3 tests/check_agent_skills.py
        language: system
        pass_filenames: false
        files: ^(\.claude-plugin/plugin\.json|agents/.*)$

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-json
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
